[project]
site_name = "Module 3 - Data Processing, Transformation & ETL"
dev_addr = "0.0.0.0:8000"

nav = [
  {"Overview" = "index.md"},
  {"Agenda" = [
    {"Day 1" = "agenda/day1.md"},
    {"Day 2" = "agenda/day2.md"},
    {"Day 3" = "agenda/day3.md"},
  ]},
  {"Day 1 - ETL Locally" = [
    {"Introducing HomeSphere" = "day1/homesphere.md"},
    {"Open Sales Data" = "day1/inspect-sales.md"},
    {"Open Product Data" = "day1/inspect-prod.md"},
    {"Clean the Sales Data" = "day1/clean.md"},
    {"Flatten and Join" = "day1/join.md"},
  ]},
  {"Day 2 - ETL in the Cloud" = [
    {"Landing Raw Data" = "day2/land-data.md"},
    {"Clean and Flatten in Fabric" = "day2/cloud-clean.md"},
    {"Build the Trusted Output" = "day2/cloud-output.md"},
  ]},
  {"Day 3 - Robust & Well-Architectured" = [
    {"Bronze, Silver, Gold" = "day3/medallion/group-scenarios.md"},
  ]},
  {"Resources" = "resources.md"},
]


[project.theme]
variant = "classic"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "toc.integrate",

  #"content.action.edit",
  #"content.action.view",
  #"header.autohide",
  #"navigation.expand",
  #"navigation.footer",
  #"navigation.instant",
  #"navigation.instant.prefetch",
  #"navigation.instant.progress",
  #"navigation.path",
  #"navigation.sections",
  #"navigation.tabs",
  #"navigation.tabs.sticky",
  #"navigation.top",
  #"navigation.tracking",
  #"search.highlight",
  #"toc.follow",
]
    
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
    
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
    
[project.theme.icon]
logo = "material/database"
    
