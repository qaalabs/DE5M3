  - Agenda:
    - Day 1: agenda/day1.md

  - "Day 1 - ETL Locally":
    - "Git Clone the Data Files": labs/11-setup.md
    - "Introducing HomeSphere": day1/homesphere.md
    - "Open Sales Data": day1/inspect-sales.md
    - "Open Product Data": day1/inspect-prod.md
    - "Clean the Sales Data": day1/clean-sales.md
    - "Flatten and Join": day1/flatten-join.md
    - "ETL Product Investigation": day1/etl-products.md

  - Resources: resources.md

not_in_nav: |
  404.md
  trainer.md
  DAY-setup.md
  day1/inspect-debrief.md
  day1/clean-intro.md
  day1/clean-debrief.md
  day1/flatten-intro.md
  day1/reflection.md
  day2/cloud-debrief.md
  day2/architecture-notes.md
  day2/output-debrief.md
  day2/reflection.md
  day3/review.md
  day3/debrief.md
  day3/bridge.md
  day4/pipeline-solution.md
  day4/checks-intro.md
