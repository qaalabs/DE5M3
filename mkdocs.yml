# Site name
site_name: Module 3 - Data Processing, Transformation & ETL
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - Overview: index.md

  - Agenda:
    - Day 1: agenda/day1.md
    - Day 2: agenda/day2.md
    - Day 3: agenda/day3.md

  - "Day 1 - ETL Locally":
    - "Introducing HomeSphere": day1/homesphere.md
    - "Open Sales Data": day1/inspect-sales.md
    - "Open Product Data": day1/inspect-prod.md
    - "Clean the Sales Data": day1/clean.md
    - "Flatten and Join": day1/join.md

  - "Day 2 - ETL in the Cloud":
    - "Landing Raw Data": day2/land-data.md
    - "Clean and Flatten in Fabric": day2/cloud-clean.md
    - "Build the Trusted Output": day2/cloud-output.md

  - "Day 3 - Robust & Well-Architectured":
    - "Bronze, Silver, Gold": day3/medallion/group-scenarios.md

  - Resources: resources.md

not_in_nav: |
  404.md
  trainer.md
  day1/inspect-debrief.md
  day1/clean-intro.md
  day1/clean-debrief.md
  day1/flatten-intro.md
  day1/reflection.md
  day2/cloud-debrief.md
  day2/output-debrief.md


# Theme
theme:
    features:
      - toc.integrate
      - content.code.copy
    name: material
    icon:
      logo: material/database

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - search
  - glightbox


