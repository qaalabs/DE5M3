# Site name
site_name: Module 3 - Data Processing, Transformation & ETL
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - "Day 1 - ETL Locally":
    - "🖥️ VM Setup": https://qaalabs.github.io/vmsetup/
    - "Git Clone the Data Files": labs/git-clone.md
    - "Introducing HomeSphere": day1/homesphere.md
    - "Part 1 ~ Inspect Sales Data": day1/inspect-sales.md
    - "Part 2 ~ Inspect Product Data": day1/inspect-prod.md
    - "Part 3 ~ Clean Sales Data": day1/clean-sales.md
    - "Flatten and Join": day1/flatten-join.md
    - "ETL Pipeline ~ Stretch Task": day1/stretch-etl-script.md
    - "ETL Product Investigation": day1/etl-products.md

# Theme
theme:
    name: material

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - print-site:
      enumerate_headings: false
      add_table_of_contents: false

